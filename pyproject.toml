[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-insight"
version = "0.1.0"
description = "A compact, evaluated RAG system with inspectable retrieval and corrective generation."
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40,<2",
  "sentence-transformers>=3,<6",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
rag-insight = "rag_insight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["TRY004"]
